x-database-url: &database-url "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20

  # Applies migrations once, then exits; api and worker start only after it succeeds.
  migrate:
    build: .
    command: ["node", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["node", "src/api/main.ts"]
    environment:
      DATABASE_URL: *database-url
      PORT: "3000"
      # Admission control: per-client submits per minute, and how many scans may be queued/running at once.
      SUBMIT_RATE_PER_MINUTE: ${SUBMIT_RATE_PER_MINUTE:-10}
      MAX_OUTSTANDING_SCANS: ${MAX_OUTSTANDING_SCANS:-200}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Optional: GitHub sign-in and private repositories (all or none; see .env.example).
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["node", "src/worker/main.ts"]
    environment:
      DATABASE_URL: *database-url
      # Optional: raises GitHub's limit from 60 to 5000 requests/hour.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional: private repositories through the FirstFix GitHub App (both or neither).
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # Source checks: limits per scan (defaults: 200 files, 256 KB each, 10 MB total).
      SOURCE_MAX_FILES: ${SOURCE_MAX_FILES:-200}
      SOURCE_MAX_FILE_BYTES: ${SOURCE_MAX_FILE_BYTES:-262144}
      SOURCE_MAX_TOTAL_BYTES: ${SOURCE_MAX_TOTAL_BYTES:-10485760}
      # Optional: AI-written explanations. Without a key, a template writes them (the report is complete either way).
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
      WORKER_CONCURRENCY: "2"
      # Retention: finished scans (with findings and keys) and idempotency keys.
      SCAN_RETENTION_DAYS: ${SCAN_RETENTION_DAYS:-30}
      IDEMPOTENCY_KEY_TTL_HOURS: ${IDEMPOTENCY_KEY_TTL_HOURS:-24}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Lets in-flight scans finish on `docker compose stop` (graceful timeout in the worker is 30 s).
    stop_grace_period: 40s
    # If the worker exits unexpectedly, Docker brings it back; its unfinished job (kept in Postgres by
    # pg-boss) is retried once the heartbeat lapses, without a new submission. `docker compose stop` still stops it.
    restart: unless-stopped

volumes:
  pgdata:
