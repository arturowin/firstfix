# M0: Postgres only. The api and worker services are added in M1.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scan
      POSTGRES_PASSWORD: scan
      POSTGRES_DB: scan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scan -d scan"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
