services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scan
      POSTGRES_PASSWORD: scan
      POSTGRES_DB: scan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scan -d scan"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Applies migrations once, then exits; api and worker start only after it succeeds.
  migrate:
    build: .
    command: ["node", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgres://scan:scan@postgres:5432/scan
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["node", "src/api/main.ts"]
    environment:
      DATABASE_URL: postgres://scan:scan@postgres:5432/scan
      PORT: "3000"
      # Admission control: per-client submits per minute, and how many scans may be queued/running at once.
      SUBMIT_RATE_PER_MINUTE: ${SUBMIT_RATE_PER_MINUTE:-10}
      MAX_OUTSTANDING_SCANS: ${MAX_OUTSTANDING_SCANS:-200}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["node", "src/worker/main.ts"]
    environment:
      DATABASE_URL: postgres://scan:scan@postgres:5432/scan
      # Optional: raises GitHub's limit from 60 to 5000 requests/hour.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional: AI-written explanations. Without a key, a template writes them (the report is complete either way).
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
      WORKER_CONCURRENCY: "2"
      # Retention: finished scans (with findings and keys) and idempotency keys.
      SCAN_RETENTION_DAYS: ${SCAN_RETENTION_DAYS:-30}
      IDEMPOTENCY_KEY_TTL_HOURS: ${IDEMPOTENCY_KEY_TTL_HOURS:-24}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Lets in-flight scans finish on `docker compose stop` (graceful timeout in the worker is 30 s).
    stop_grace_period: 40s

volumes:
  pgdata:
